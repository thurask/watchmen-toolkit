# Lint, test and package checks for watchmen-toolkit.
# The test suite needs no game files (tests/conftest.py builds synthetic data),
# so every job runs on a clean runner. Actions are pinned by commit; Dependabot
# (.github/dependabot.yml) proposes the updates.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # ruff is pinned here so a new ruff release cannot fail an unchanged tree;
  # raise it together with the `ruff>=` floor of the dev extra
  RUFF_VERSION: "0.17.0"
  # the Khronos validator used by tests/test_gltf_validator.py
  GLTF_VALIDATOR_VERSION: "2.0.0-dev.3.10"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==${RUFF_VERSION}"
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.deps }} deps)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
        deps: [latest]
        include:
          # the dependency floors of pyproject.toml (numpy>=2.1, Pillow>=11);
          # numpy 2.1 has no 3.14 wheels, so the floor runs on 3.13 only
          - os: ubuntu-latest
            python: "3.13"
            deps: minimum
          - os: windows-latest
            python: "3.13"
            deps: minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (latest dependencies)
        if: matrix.deps == 'latest'
        # regdump pulls in capstone, which one test of test_names.py needs
        run: python -m pip install -e ".[dev,regdump]"
      - name: Install (minimum dependencies)
        if: matrix.deps == 'minimum'
        run: python -m pip install -e ".[dev,regdump]" "numpy==2.1.*" "Pillow==11.0.*"
      - run: python -m pip list
      # expected on a lone checkout: 2 skipped (the jiggle comparisons against the
      # unreleased tk130/tk140 trees) and 2 deselected (the glTF validator tests,
      # run by the gltf-validator job below)
      - run: python -m pytest -q -rs

  gltf-validator:
    name: glTF validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install -e ".[dev]"
      - name: Install gltf-validator
        run: |
          mkdir -p "$RUNNER_TEMP/gltfv"
          npm install --prefix "$RUNNER_TEMP/gltfv" --no-audit --no-fund "gltf-validator@${GLTF_VALIDATOR_VERSION}"
      - name: Validate every GLB writer
        env:
          WATCHMEN_GLTF_VALIDATOR: ${{ runner.temp }}/gltfv
        run: python -m pytest -q tests/test_gltf_validator.py

  package:
    name: build and install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel into a clean venv and run both commands
        run: |
          want="watchmen-kapow-toolkit $(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          for cmd in watchmen watchmen-kapow; do
            got="$("$RUNNER_TEMP/wheel-venv/bin/$cmd" --version)"
            echo "$cmd: $got"
            test "$got" = "$want"
          done
          # the shipped data tables are in the wheel
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -c "import importlib.resources as r; n = [p.name for p in r.files('wlib').iterdir() if p.suffix in ('.pkl', '.json')]; print(len(n), 'data tables'); assert {'prop_hash_dict.pkl', 'kapow_fragment_keys.pkl', 'canonical_names.json'} <= set(n)"
      - name: Python floor (3.12 is refused)
        env:
          PY312: ${{ steps.py312.outputs.python-path }}
        run: |
          set +e
          "$PY312" -I watchmen.py --version; rc=$?
          test "$rc" = 2 || { echo "watchmen.py on 3.12 exited $rc, expected 2"; exit 1; }
          "$PY312" -m venv "$RUNNER_TEMP/py312-venv"
          "$RUNNER_TEMP/py312-venv/bin/python" -m pip install dist/*.whl; rc=$?
          test "$rc" != 0 || { echo "pip installed the wheel on 3.12"; exit 1; }
          echo "3.12 refused by watchmen.py (exit 2) and by pip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
