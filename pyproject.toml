[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string and `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "watchmen-kapow-toolkit"
version = "1.5.0"
description = "Asset extraction toolkit for Watchmen: The End Is Nigh Parts 1 & 2 (Kapow engine) — .naz archives, textures, models, audio, fragments, and engine-exact character animation on PC, Xbox 360, and PS3."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "thurask"}]
requires-python = ">=3.13"
keywords = ["reverse-engineering", "game-assets", "kapow", "watchmen", "naz", "glb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Archiving",
]
dependencies = [
    # the first releases with Python 3.13 wheels that declare 3.13 support
    "numpy>=2.1",
    "Pillow>=11",
]

[project.urls]
Homepage = "https://github.com/thurask/watchmen-toolkit"
Repository = "https://github.com/thurask/watchmen-toolkit"
Issues = "https://github.com/thurask/watchmen-toolkit/issues"

[project.optional-dependencies]
dev = ["ruff>=0.17", "pytest"]  # 1.5.1: ruff replaces black + pyflakes (ruff format / ruff check)
# for `watchmen gendata regdump` (needs an exe whose .text is not encrypted)
regdump = ["capstone"]

[project.scripts]
watchmen = "watchmen:cli"
# the same command under a name that does not collide with other "watchmen" tools
watchmen-kapow = "watchmen:cli"

[tool.setuptools]
py-modules = ["watchmen"]
packages = ["wlib"]

[tool.setuptools.package-data]
wlib = ["*.pkl", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Markdown code blocks are reference prose, not code to reformat
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/F = what pyflakes + pycodestyle-errors reported before; B (bugbear) and UP (pyupgrade) added.
select = ["E", "F", "B", "UP"]
ignore = [
    "E501",  # line length: the formatter decides; long docstring / data lines stay
    "E731",  # lambda assignment: the flat modules use small named lambdas on purpose (78)
    "E741",  # ambiguous names l / I / O in math code (27)
    "B007",  # unused loop variable (38; enumerate() counters kept for readability)
    "B023",  # closure over a loop variable: every case is called within its own iteration (26; review later)
    "B905",  # zip() without strict= (70; the pairs are same-length by construction)
    "B911",  # itertools.batched() without strict= (12)
    "UP031", # printf-style %-formatting: the house style of the whole tree (1,219)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
