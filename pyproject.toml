[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchmen-kapow-toolkit"
version = "1.5.0"
description = "Asset extraction toolkit for Watchmen: The End Is Nigh Parts 1 & 2 (Kapow engine) — .naz archives, textures, models, audio, fragments, and engine-exact character animation on PC, Xbox 360, and PS3."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "thurask"}]
requires-python = ">=3.13"
keywords = ["reverse-engineering", "game-assets", "kapow", "watchmen", "naz", "glb"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Archiving",
]
dependencies = [
    # the first releases with Python 3.13 wheels that declare 3.13 support
    "numpy>=2.1",
    "Pillow>=11",
]

[project.urls]
Homepage = "https://github.com/thurask/watchmen-toolkit"
Repository = "https://github.com/thurask/watchmen-toolkit"
Issues = "https://github.com/thurask/watchmen-toolkit/issues"

[project.optional-dependencies]
dev = ["black", "pyflakes", "pytest"]
# for `watchmen gendata regdump` (needs an exe whose .text is not encrypted)
regdump = ["capstone"]

[project.scripts]
watchmen = "watchmen:cli"
# the same command under a name that does not collide with other "watchmen" tools
watchmen-kapow = "watchmen:cli"

[tool.setuptools]
py-modules = ["watchmen"]
packages = ["wlib"]

[tool.setuptools.package-data]
wlib = ["*.pkl", "*.json"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
